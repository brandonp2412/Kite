<svg xmlns="http://www.w3.org/2000/svg" width="536" height="160" viewBox="0 0 536 160" role="img" aria-labelledby="title desc">
  <title id="title">Get Kite on GitHub Releases</title>
  <desc id="desc">A custom Kite download badge linking to GitHub Releases.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="16" x2="516" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061B3D"/>
      <stop offset="0.52" stop-color="#003197"/>
      <stop offset="1" stop-color="#494FE8"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-20%" width="116%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00102D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="520" height="144" rx="30" fill="url(#bg)" stroke="#8EC4FD" stroke-opacity="0.55" stroke-width="2" filter="url(#shadow)"/>

  <g transform="translate(32 28)">
    <rect width="104" height="104" rx="25" fill="#003197"/>
    <g transform="translate(19.76 19.76) scale(0.0597)">
      <path d="M285 185 H430 V455 L650 185 H835 L575 505 L455 600 L430 580 V875 H285 Z" fill="#8EC4FD"/>
      <path d="M455 600 L575 505 L865 875 H680 Z" fill="#8E81FD"/>
      <path d="M650 185 H835 L575 505 L505 560 L555 385 Z" fill="#494FE8"/>
    </g>
  </g>

  <g fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif">
    <text x="158" y="62" font-size="22" font-weight="700" letter-spacing="2.4" opacity="0.82">GET KITE ON</text>
    <text x="158" y="111" font-size="42" font-weight="750" letter-spacing="-0.7">GitHub Releases</text>
  </g>

</svg>
