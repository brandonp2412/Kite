IssueTracker: https://github.com/brandonp2412/Kite/issues

AutoName: Kite
Description: |-
  Kite is a native Matrix messenger built with Kotlin, Compose and the Matrix
  Rust SDK. It supports encrypted chats, multiple accounts, room search,
  reactions, replies and media attachments.

  Kite is a fork of SchildiChat Revenge and retains upstream attribution.

RepoType: git
Repo: https://github.com/brandonp2412/Kite.git

Builds:
  - versionName: 1.0.96
    versionCode: 96
    commit: 1.0.96
    timeout: 7200
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y openjdk-25-jdk-headless clang cmake libclang-dev libssl-dev
        ninja-build pkg-config protobuf-compiler
      - update-alternatives --auto java
    patch:
      - fdroid-gradle-settings.patch
    output: androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
    binary: https://github.com/brandonp2412/Kite/releases/download/%v/Kite-%v-arm64-v8a.apk
    srclibs:
      - rustup@1.27.1
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-25-openjdk-amd64
      - export PATH="$JAVA_HOME/bin:$PATH"
      - export CARGO_BUILD_JOBS=2
      - export RUSTUP_HOME="$HOME/.rustup"
      - export CARGO_HOME="$HOME/.cargo"
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.99.1 --profile minimal
        --target aarch64-linux-android
      - source "$CARGO_HOME/env"
      - cargo install cargo-ndk@4.1.2 --locked
      - gradlew-fdroid :androidApp:assembleRelease -PfdroidBuild=true -PandroidAbi=arm64-v8a
        -PandroidVersionName=$$VERSION$$ --no-daemon
    ndk: 28.2.13676358

