name: kite
arch: amd64
platform: linux
version: ${VERSION}
version_schema: none
section: net
priority: optional
maintainer: Kite contributors
description: Matrix chat client
vendor: Kite
homepage: https://github.com/brandonp2412/Kite
license: AGPL-3.0-only

contents:
  - src: ./composeApp/build/compose/binaries/main-release/linux-package-root/opt/kite/
    dst: /opt/kite/
    type: tree
    file_info: &root_info
      owner: root
      group: root
  - src: ./composeApp/build/compose/binaries/main-release/linux-package-root/usr/bin/kite
    dst: /usr/bin/kite
    file_info:
      <<: *root_info
      mode: 0755
  - src: ./composeApp/build/compose/binaries/main-release/linux-package-root/usr/share/applications/kite.desktop
    dst: /usr/share/applications/kite.desktop
    file_info: &root_file_info
      <<: *root_info
      mode: 0644
  - src: ./composeApp/build/compose/binaries/main-release/linux-package-root/usr/share/applications/chat-schildi-revenge-MainKt.desktop
    dst: /usr/share/applications/chat-schildi-revenge-MainKt.desktop
    file_info: *root_file_info
  - src: ./composeApp/build/compose/binaries/main-release/linux-package-root/usr/share/icons/hicolor/48x48/apps/kite.png
    dst: /usr/share/icons/hicolor/48x48/apps/kite.png
    file_info: *root_file_info
  - src: ./composeApp/build/compose/binaries/main-release/linux-package-root/usr/share/icons/hicolor/72x72/apps/kite.png
    dst: /usr/share/icons/hicolor/72x72/apps/kite.png
    file_info: *root_file_info
  - src: ./composeApp/build/compose/binaries/main-release/linux-package-root/usr/share/icons/hicolor/96x96/apps/kite.png
    dst: /usr/share/icons/hicolor/96x96/apps/kite.png
    file_info: *root_file_info
  - src: ./composeApp/build/compose/binaries/main-release/linux-package-root/usr/share/icons/hicolor/144x144/apps/kite.png
    dst: /usr/share/icons/hicolor/144x144/apps/kite.png
    file_info: *root_file_info
  - src: ./composeApp/build/compose/binaries/main-release/linux-package-root/usr/share/icons/hicolor/192x192/apps/kite.png
    dst: /usr/share/icons/hicolor/192x192/apps/kite.png
    file_info: *root_file_info
