[package]
name = "kite_matrix_bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
matrix-sdk = { version = "0.18.0", features = ["bundled-sqlite"] }
matrix-sdk-crypto = "0.18.0"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
