name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whitespace and patch formatting
        env:
          BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            base="$PR_BASE"
          elif [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            base="$BASE"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          git diff --check "$base" HEAD
      - name: Screenshot generator syntax
        run: python3 -c 'import ast; ast.parse(open("scripts/generate_screenshots.py").read())'

  test-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: matrix-rust-sdk
      - name: Install Android SDK and Rust build dependencies
        run: |
          sdkmanager="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$sdkmanager" 'platforms;android-37' 'build-tools;37.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev libssl-dev ninja-build pkg-config protobuf-compiler
      - name: Unit tests, Android lint and UI contract checks
        run: ./gradlew :composeApp:desktopTest :androidApp:lintDebug :androidApp:verifyKiteLongPressMenu --no-daemon --stacktrace
