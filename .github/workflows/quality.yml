name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contract:
    # Golden tests depend on the runner's font/rendering stack. Keep the
    # Ubuntu major version explicit so a future latest-image migration does
    # not silently invalidate every screenshot baseline.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt

      - name: Matrix Rust bridge
        run: |
          cargo fmt --manifest-path rust/kite_matrix_bridge/Cargo.toml --check
          cargo test --manifest-path rust/kite_matrix_bridge/Cargo.toml --locked
          cargo build --manifest-path rust/kite_matrix_bridge/Cargo.toml --locked

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Install release-audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Release audit
        run: tool/release_audit.sh

      - name: Analyze
        run: flutter analyze

      - name: Dart/Rust Matrix ABI smoke test
        env:
          KITE_MATRIX_BRIDGE_LIBRARY: ${{ github.workspace }}/rust/kite_matrix_bridge/target/debug/libkite_matrix_bridge.so
        run: flutter test test/matrix_rust_native_bridge_test.dart

      - name: Deterministic tests and performance-contract pin
        run: flutter test

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures
          if-no-files-found: ignore
          retention-days: 7

  android-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: kite-android-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$sdkmanager"
          "$sdkmanager" 'ndk;28.2.13676358'

      - name: Dependencies
        run: flutter pub get

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > android/key.properties

      - name: Build signed Android APKs
        run: |
          export KITE_ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64,android-x64
          tool/verify_android_matrix_bridge.sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk arm64-v8a
          tool/verify_android_matrix_bridge.sh build/app/outputs/flutter-apk/app-x86_64-release.apk x86_64
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/release/kite-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/release/kite-x86_64.apk

      - name: Verify signed APKs and pubspec version
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$apksigner"
          test -n "$aapt"
          expected_fingerprint='c5afe55b3b7c50f43aaa1f14f8e38e922c0ffc814324b3a5009bc1c070e4284b'
          app_version="$(sed -n 's/^version: //p' pubspec.yaml)"
          expected_version_code="${app_version##*+}"
          expected_version_name="${app_version%%+*}"
          for apk in build/release/kite-arm64-v8a.apk build/release/kite-x86_64.apk; do
            actual_fingerprint="$($apksigner verify --print-certs "$apk" | sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
            badging="$($aapt dump badging "$apk" | head -1)"
            actual_version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging")"
            actual_version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging")"
            test "$actual_fingerprint" = "$expected_fingerprint"
            test "$actual_version_code" = "$expected_version_code"
            test "$actual_version_name" = "$expected_version_name"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kite-android
          path: |
            build/release/kite-arm64-v8a.apk
            build/release/kite-x86_64.apk
          if-no-files-found: error

      - name: Publish latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            printf 'Skipping release publish because main advanced to %s.\n' "$latest_sha"
            exit 0
          fi
          app_version="$(sed -n 's/^version: //p' pubspec.yaml)"
          gh release delete android-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create android-latest \
            build/release/kite-arm64-v8a.apk \
            build/release/kite-x86_64.apk \
            --target "$GITHUB_SHA" \
            --title 'Kite Android (latest)' \
            --notes "ARM64 and x86_64 Android builds signed with the F-Droid signing key from ${GITHUB_SHA:0:7}. Version ${app_version} from pubspec.yaml. CI run ${GITHUB_RUN_NUMBER}." \
            --latest
