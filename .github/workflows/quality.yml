name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Matrix Rust bridge
        run: |
          cargo fmt --manifest-path rust/kite_matrix_bridge/Cargo.toml --check
          cargo test --manifest-path rust/kite_matrix_bridge/Cargo.toml --locked
          cargo build --manifest-path rust/kite_matrix_bridge/Cargo.toml --locked

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Install release-audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Release audit
        run: tool/release_audit.sh

      - name: Analyze
        run: flutter analyze

      - name: Dart/Rust Matrix ABI smoke test
        env:
          KITE_MATRIX_BRIDGE_LIBRARY: ${{ github.workspace }}/rust/kite_matrix_bridge/target/debug/libkite_matrix_bridge.so
        run: flutter test test/matrix_rust_native_bridge_test.dart

      - name: Deterministic tests and performance-contract pin
        run: flutter test

  android-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: kite-release
    timeout-minutes: 30
    concurrency:
      group: kite-android-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tooling
        run: |
          command -v gh
          apksigner="$(find /opt/android-sdk/build-tools -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          env -u GH_TOKEN -u GITHUB_TOKEN gh api repos/brandonp2412/Flexify >/dev/null

      - name: Request Flexify F-Droid signed ARM64 APK
        run: |
          set -euo pipefail
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Sign Kite ARM64 ${request_id}"
          env -u GH_TOKEN -u GITHUB_TOKEN gh workflow run sign-kite-android.yml \
            --repo brandonp2412/Flexify \
            -f kite_sha="$GITHUB_SHA" \
            -f build_number="$GITHUB_RUN_NUMBER" \
            -f request_id="$request_id"

          run_id=''
          for _ in $(seq 1 30); do
            run_id="$(env -u GH_TOKEN -u GITHUB_TOKEN gh run list \
              --repo brandonp2412/Flexify \
              --workflow sign-kite-android.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"${title}\") | .databaseId" \
              | head -1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          printf 'FLEXIFY_SIGN_RUN_ID=%s\n' "$run_id" >> "$GITHUB_ENV"
          printf 'FLEXIFY_SIGN_REQUEST_ID=%s\n' "$request_id" >> "$GITHUB_ENV"
          env -u GH_TOKEN -u GITHUB_TOKEN gh run watch "$run_id" --repo brandonp2412/Flexify --exit-status

      - name: Download signed ARM64 APK
        run: |
          rm -rf build/release
          mkdir -p build/release
          env -u GH_TOKEN -u GITHUB_TOKEN gh run download "$FLEXIFY_SIGN_RUN_ID" \
            --repo brandonp2412/Flexify \
            --name "kite-arm64-${FLEXIFY_SIGN_REQUEST_ID}" \
            --dir build/release
          test -s build/release/app-arm64-v8a-release.apk
          mv build/release/app-arm64-v8a-release.apk build/release/kite-arm64-v8a.apk

      - name: Verify signed APK
        run: |
          set -euo pipefail
          apk='build/release/kite-arm64-v8a.apk'
          tool/verify_android_matrix_bridge.sh "$apk" arm64-v8a
          apksigner="$(find /opt/android-sdk/build-tools -type f -name apksigner | sort -V | tail -1)"
          actual="$($apksigner verify --print-certs "$apk" | sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          expected='011ee1a6e4e5ecd675f67fbf3d78ad82614a7a7a3f24ed71cc9c417154a0f0fd'
          test "$actual" = "$expected"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kite-arm64-v8a
          path: build/release/kite-arm64-v8a.apk
          if-no-files-found: error

      - name: Publish latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            printf 'Skipping release publish because main advanced to %s.\n' "$latest_sha"
            exit 0
          fi
          gh release delete android-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create android-latest \
            build/release/kite-arm64-v8a.apk \
            --target "$GITHUB_SHA" \
            --title 'Kite Android (latest)' \
            --notes "ARM64 Android build signed with the Flexify F-Droid key from ${GITHUB_SHA:0:7}. CI run ${GITHUB_RUN_NUMBER}." \
            --latest
