name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Matrix Rust bridge
        run: |
          cargo fmt --manifest-path rust/kite_matrix_bridge/Cargo.toml --check
          cargo test --manifest-path rust/kite_matrix_bridge/Cargo.toml --locked
          cargo build --manifest-path rust/kite_matrix_bridge/Cargo.toml --locked

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Install release-audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Release audit
        run: tool/release_audit.sh

      - name: Analyze
        run: flutter analyze

      - name: Dart/Rust Matrix ABI smoke test
        env:
          KITE_MATRIX_BRIDGE_LIBRARY: ${{ github.workspace }}/rust/kite_matrix_bridge/target/debug/libkite_matrix_bridge.so
        run: flutter test test/matrix_rust_native_bridge_test.dart

      - name: Deterministic tests and performance-contract pin
        run: flutter test

  android-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-contract
    runs-on: kite-release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release toolchain
        run: |
          command -v flutter
          command -v cargo
          command -v rustup
          command -v gh
          test -d /opt/android-sdk/ndk/28.2.13676358
          rustup target add aarch64-linux-android

      - name: Use local release signing key
        run: |
          test -f "$HOME/.config/android-signing/fdroid.properties"
          ln -sfn "$HOME/.config/android-signing/fdroid.properties" android/key.properties

      - name: Dependencies
        run: flutter pub get

      - name: Build ARM64 Matrix bridge
        env:
          KITE_ANDROID_NDK_ROOT: /opt/android-sdk/ndk/28.2.13676358
        run: tool/build_android_matrix_bridge.sh arm64-v8a

      - name: Build signed ARM64 APK
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-number "$GITHUB_RUN_NUMBER"
          tool/verify_android_matrix_bridge.sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk arm64-v8a

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kite-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Publish latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create android-latest \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --target "$GITHUB_SHA" \
            --title 'Kite Android (latest)' \
            --notes "Signed ARM64 Android build from ${GITHUB_SHA:0:7}. CI run ${GITHUB_RUN_NUMBER}." \
            --latest
